<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10100f"><title>MOA WORLD 更新</title><style>body{background:#10100f;color:#f4eedb;font:18px/1.65 sans-serif;padding:24px;max-width:520px;margin:auto}h1{font-size:25px;color:#e4cc8c}button{background:#e4cc8c;color:#18140b;border:0;border-radius:12px;padding:14px 18px;width:100%;font-size:18px;font-weight:bold}a{color:#e4cc8c}</style></head><body><h1>MOA WORLD 安全更新</h1><p>アプリの古いプログラムだけを更新します。人物・画像・設定の保存領域には触れません。</p><button id="go">アプリを更新する</button><p id="status" role="status"></p><script>
document.getElementById('go').onclick=async function(){this.disabled=true;const status=document.getElementById('status');status.textContent='古いプログラムを更新しています…';try{const scope=new URL('./',location.href).href;if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(r.scope===scope)await r.unregister();}}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('moa-world-')).map(k=>caches.delete(k)));}location.replace('./index.html?v=20261125-searchfix2');}catch(e){status.textContent='更新できませんでした。保存データは変更していません。'+e.message;this.disabled=false;}};
</script></body></html>
