<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="萌愛ちゃんワールドの人物・画像・関係・予定・制作進行を端末内で管理するPWA" />
  <title>MOA WORLD</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">MOA WORLD</div>
        <h1 id="screenTitle">ホーム</h1>
      </div>
      <button id="quickAdd" class="icon-btn" aria-label="追加">＋</button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button data-view="home" class="nav-btn active"><span>⌂</span><small>ホーム</small></button>
      <button data-view="members" class="nav-btn"><span>♙</span><small>メンバー</small></button>
      <button data-view="schedule" class="nav-btn"><span>▦</span><small>予定</small></button>
      <button data-view="production" class="nav-btn"><span>◫</span><small>制作</small></button>
      <button data-view="settings" class="nav-btn"><span>⚙</span><small>設定</small></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <input id="importFile" type="file" accept="application/json" hidden />
  <script src="./app.js"></script>
</body>
</html>
